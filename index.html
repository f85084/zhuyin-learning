<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注音學習單產生器</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 Global CDN -->

  <style>

      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: white; }

      .print-container { width: 100%; height: 100vh; padding: 0; margin: 0; display: flex; justify-content: center; align-items: flex-start; }
      .worksheet-paper { box-shadow: none !important; margin: 0 !important; width: 210mm; height: 297mm; border: none !important; }
    }
    .text-outline {
      color: white;
      -webkit-text-stroke: 2px #374151;
    }
    .text-dashed {
      color: transparent;
      -webkit-text-stroke: 2px #d1d5db;
    }
    .title-badge {
      background-color: #d1fae5;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: bold;
      color: #065f46;
      display: inline-block;
      font-size: 14px;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans overflow-hidden">

            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>

        </div>
        <p class="text-sm opacity-80">選擇注音，生成專屬練習單</p>
      </div>
      
      <div class="flex-1 overflow-y-auto p-4 grid grid-cols-4 gap-2 content-start">

          @click="handleSelect(idx)"
          :class="[
            'text-xl font-bold p-2 rounded-lg transition-all duration-200',
            selectedIndex === idx 
              ? 'bg-emerald-500 text-white shadow-md transform scale-105' 
              : 'bg-gray-50 text-gray-600 hover:bg-emerald-100'
          ]"
        >
          {{ item.char }}
        </button>
      </div>
      
      <div class="p-4 border-t bg-gray-50">
        <button 
          @click="handlePrint"
          class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-sm transition-colors"
        >

          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                  {{ word.e }}
                </div>
                <!-- 客製化 Flexbox 排版，精準控制聲調位置 -->
                <div class="flex flex-col items-start justify-center">
                  <div v-for="(char, index) in word.w.split('')" :key="index" class="flex items-center justify-start mb-2">
                    <!-- 國字 -->
                    <div class="text-[26px] font-black text-gray-800 leading-none">{{ char }}</div>
                    
                    <!-- 注音與聲調區塊 -->
                    <div class="relative flex ml-1 h-full items-center">
                      <!-- 輕聲 (放在最上方) -->
                      <span v-if="getTone(word.z, index) === '˙'" class="absolute -top-[12px] left-1/2 -translate-x-1/2 text-[14px] font-black text-gray-500">˙</span>

                      <div class="flex flex-col items-center justify-center text-[12px] font-bold text-gray-500 leading-none">
                        <span v-for="(bz, j) in getBaseZ(word.z, index)" :key="j" class="mb-[1px]">{{ bz }}</span>
                      </div>

                      <!-- 二、三、四聲 (放在右側，垂直正中間) -->
                      <span v-if="['ˊ', 'ˇ', 'ˋ'].includes(getTone(word.z, index))" class="absolute -right-[12px] top-1/2 -translate-y-1/2 text-[14px] font-black text-gray-500">
                        {{ getTone(word.z, index) }}
                      </span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

      { char: 'ㄤ', words: [{ w: '太陽', z: 'ㄊㄞˋ ㄧㄤˊ', e: '☀️' }, { w: '蟑螂', z: 'ㄓㄤ ㄌㄤˊ', e: '🪳' }, { w: '胖子', z: 'ㄆㄤˋ ㄗ˙', e: '🧍‍♂️' }] },
      { char: 'ㄥ', words: [{ w: '蜜蜂', z: 'ㄇㄧˋ ㄈㄥ', e: '🐝' }, { w: '恐龍', z: 'ㄎㄨㄥˇ ㄌㄨㄥˊ', e: '🦖' }, { w: '老鷹', z: 'ㄌㄠˇ ㄧㄥ', e: '🦅' }] },
      { char: 'ㄦ', words: [{ w: '耳朵', z: 'ㄦˇ ㄉㄨㄛ˙', e: '👂' }, { w: '兒童', z: 'ㄦˊ ㄊㄨㄥˊ', e: '🧒' }, { w: '鳥兒', z: 'ㄋㄧㄠˇ ㄦ', e: '🐦' }] }
    ];

    // Wait, let's fix the typo in line 17 of ZHUYIN_DATA (ㄕ):
    ZHUYIN_DATA[16].words[2] = { w: '梳子', z: 'ㄕㄨ ㄗ˙', e: '🪮' };

    const ALL_CHARS = ZHUYIN_DATA.map(d => d.char);

    const generateBubbles = (targetChar) => {
      const bubbles = Array(6).fill(targetChar);
      const others = ALL_CHARS.filter(c => c !== targetChar);
      for (let i = 0; i < 6; i++) {
        bubbles.push(others[Math.floor(Math.random() * others.length)]);
      }
      return bubbles.sort(() => Math.random() - 0.5);
    };

    createApp({
      setup() {
        const selectedIndex = ref(0);
        const activeData = computed(() => ZHUYIN_DATA[selectedIndex.value]);
        const bubbles = ref(generateBubbles(activeData.value.char));

        const handleSelect = (idx) => {
          selectedIndex.value = idx;
          bubbles.value = generateBubbles(ZHUYIN_DATA[idx].char);
        };

        const handlePrint = () => {
          window.print();
        };

        const getTone = (zStr, index) => {
          const z = zStr.split(' ')[index] || '';
          const toneMatch = z.match(/[ˊˇˋ˙]/);
          return toneMatch ? toneMatch[0] : '';
        };

        const getBaseZ = (zStr, index) => {
          const z = zStr.split(' ')[index] || '';
          const base = z.replace(/[ˊˇˋ˙]/g, '');
          return base.split('');
        };

        return {
          zhuyinData: ZHUYIN_DATA,
          selectedIndex,
          activeData,
          bubbles,
          handleSelect,
          handlePrint,
          getTone,
          getBaseZ
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
