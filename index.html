<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="用寶可夢圖片與逐字直式注音，練習辨認和朗讀寶可夢名稱。">
  <title>寶可夢注音圖鑑</title>
  <style>
    :root {
      --red: #e33536;
      --red-dark: #b91c2a;
      --blue: #2368b5;
      --blue-dark: #123d72;
      --yellow: #ffcb05;
      --ink: #15243a;
      --muted: #637083;
      --line: #d9e2ef;
      --paper: #ffffff;
      --surface: #f3f7fc;
      --shadow: 0 14px 36px rgba(25, 54, 94, .12);
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 6%, rgba(255, 203, 5, .2), transparent 21rem),
        radial-gradient(circle at 92% 0%, rgba(35, 104, 181, .13), transparent 24rem),
        var(--surface);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      font-size: 16px;
    }

    button, input, select { font: inherit; }
    button, select { cursor: pointer; }
    img { display: block; max-width: 100%; }

    .app-header {
      color: #fff;
      background: linear-gradient(120deg, #c91f31 0%, var(--red) 52%, #ef5361 100%);
      border-bottom: 7px solid var(--yellow);
    }

    .header-inner, .page-shell {
      width: min(1180px, calc(100% - 32px));
      margin-inline: auto;
    }

    .header-inner {
      min-height: 108px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding-block: 20px;
    }

    .brand { display: flex; align-items: center; gap: 16px; }

    .brand-badge {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 4px solid #fff;
      border-radius: 18px;
      color: var(--blue-dark);
      background: var(--yellow);
      box-shadow: 0 7px 0 rgba(85, 10, 24, .25);
      font-size: 30px;
      font-weight: 1000;
      transform: rotate(-3deg);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3.8vw, 2.45rem);
      line-height: 1.15;
      letter-spacing: .04em;
    }

    .header-copy p {
      margin: 7px 0 0;
      color: rgba(255, 255, 255, .88);
      font-size: .98rem;
    }

    .collection-count {
      min-width: 140px;
      padding: 11px 16px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 16px;
      background: rgba(101, 8, 24, .19);
      text-align: center;
      font-weight: 800;
      white-space: nowrap;
    }

    .collection-count strong {
      display: block;
      color: var(--yellow);
      font-size: 1.45rem;
      line-height: 1.1;
    }

    .page-shell { padding: 28px 0 52px; }

    .toolbar {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(190px, 1.25fr) repeat(2, minmax(130px, .7fr)) auto auto auto;
      gap: 12px;
      align-items: end;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255,255,255,.94);
      box-shadow: var(--shadow);
    }

    .field { display: grid; gap: 6px; }

    .field label {
      color: var(--blue-dark);
      font-size: .88rem;
      font-weight: 900;
    }

    input, select, .button { min-height: 46px; border-radius: 12px; outline: none; }

    input, select {
      width: 100%;
      padding: 0 13px;
      border: 2px solid #cbd7e6;
      color: var(--ink);
      background: #fff;
    }

    input:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(35, 104, 181, .13);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 15px;
      border: 2px solid transparent;
      font-weight: 900;
      white-space: nowrap;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .button:hover { transform: translateY(-2px); }
    .button:focus-visible { outline: 4px solid rgba(35,104,181,.25); outline-offset: 2px; }

    .button-primary { color: #fff; background: var(--blue); box-shadow: 0 5px 0 var(--blue-dark); }
    .button-secondary { color: var(--blue-dark); border-color: #bfd0e5; background: #eef5fd; }
    .button-print { color: #fff; background: var(--red); box-shadow: 0 5px 0 var(--red-dark); }

    .worksheet-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 30px 2px 18px;
    }

    .worksheet-head h2 {
      margin: 0;
      font-size: clamp(1.35rem, 2vw, 1.8rem);
      color: var(--blue-dark);
    }

    .worksheet-head p { margin: 5px 0 0; color: var(--muted); line-height: 1.55; }

    .batch-summary {
      flex: 0 0 auto;
      padding: 8px 13px;
      border-radius: 999px;
      color: #8f2330;
      background: #ffe8ea;
      font-size: .9rem;
      font-weight: 900;
    }

    .pokemon-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .pokemon-card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-top: 5px solid var(--red);
      border-radius: 21px;
      background: var(--paper);
      box-shadow: 0 9px 24px rgba(24, 51, 86, .09);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .pokemon-card:hover { transform: translateY(-4px); box-shadow: 0 15px 30px rgba(24, 51, 86, .14); }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px 0;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 900;
      letter-spacing: .03em;
    }

    .dex-number { color: var(--red-dark); }

    .artwork-wrap {
      height: 180px;
      display: grid;
      place-items: center;
      padding: 4px 18px 0;
      background: radial-gradient(circle, #f8fbff 0 43%, transparent 44%);
    }

    .artwork-wrap img {
      width: 164px;
      height: 164px;
      object-fit: contain;
      filter: drop-shadow(0 10px 7px rgba(25, 44, 71, .13));
    }

    .name-panel {
      min-height: 116px;
      display: grid;
      place-items: center;
      padding: 15px 12px 20px;
      border-top: 1px dashed #c9d5e4;
      background: linear-gradient(#fff, #fbfdff);
    }

    .ruby-name {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      max-width: 100%;
    }

    .annotated-character {
      display: inline-grid;
      grid-template-columns: auto 1.55rem;
      align-items: center;
      column-gap: 2px;
    }

    .hanzi {
      color: #111827;
      font-family: "BiauKai", "DFKai-SB", "標楷體", "Noto Serif TC", serif;
      font-size: clamp(2rem, 3.2vw, 2.55rem);
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
    }

    .phonetic {
      height: 4.15rem;
      display: grid;
      grid-template-columns: .85rem .65rem;
      align-items: center;
      justify-content: start;
      color: var(--blue);
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-weight: 900;
    }

    .phonetic-symbols {
      justify-self: center;
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 1rem;
      line-height: .9;
      letter-spacing: .03em;
    }

    .tone {
      align-self: center;
      justify-self: start;
      color: var(--red);
      font-size: 1.25rem;
      font-weight: 1000;
      line-height: 1;
    }

    .tone-light { align-self: start; margin-top: .18rem; }
    .tone-empty { visibility: hidden; }
    body.zhuyin-hidden .phonetic { visibility: hidden; }

    .empty-state, .loading-state {
      grid-column: 1 / -1;
      min-height: 300px;
      display: grid;
      place-items: center;
      padding: 32px;
      border: 2px dashed #bdcadb;
      border-radius: 22px;
      color: var(--muted);
      background: rgba(255,255,255,.72);
      text-align: center;
      font-weight: 800;
    }

    .learning-note {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
      padding: 14px 17px;
      border-left: 5px solid var(--yellow);
      border-radius: 12px;
      color: #34445a;
      background: #fff;
      box-shadow: 0 7px 18px rgba(24, 51, 86, .06);
      line-height: 1.55;
    }

    .learning-note strong { color: var(--blue-dark); }

    @media (max-width: 980px) {
      .toolbar { grid-template-columns: repeat(3, 1fr); }
      .pokemon-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .header-inner, .page-shell { width: min(100% - 22px, 1180px); }
      .header-inner { min-height: auto; align-items: flex-start; }
      .brand-badge { width: 48px; height: 48px; border-radius: 14px; font-size: 25px; }
      .header-copy p { font-size: .9rem; }
      .collection-count { display: none; }
      .page-shell { padding-top: 18px; }
      .toolbar { grid-template-columns: 1fr 1fr; padding: 14px; }
      .field-search { grid-column: 1 / -1; }
      .button { padding-inline: 10px; }
      .worksheet-head { align-items: flex-start; flex-direction: column; margin-top: 24px; }
      .pokemon-grid { grid-template-columns: 1fr; }
      .artwork-wrap { height: 200px; }
      .artwork-wrap img { width: 182px; height: 182px; }
      .hanzi { font-size: 2.5rem; }
    }

    @media print {
      @page { size: A4 portrait; margin: 11mm; }
      body { background: #fff; }
      .app-header { color: var(--ink); background: #fff; border-bottom: 3px solid var(--red); }
      .header-inner { min-height: auto; padding-block: 8px 12px; }
      .brand-badge, .header-copy p, .collection-count, .toolbar, .learning-note { display: none !important; }
      .page-shell { width: 100%; padding: 0; }
      .worksheet-head { margin: 14px 0 10px; }
      .worksheet-head p { display: none; }
      .pokemon-grid { grid-template-columns: repeat(3, 1fr); gap: 9px; }
      .pokemon-card { break-inside: avoid; box-shadow: none; border-radius: 12px; }
      .pokemon-card:hover { transform: none; }
      .artwork-wrap { height: 112px; }
      .artwork-wrap img { width: 108px; height: 108px; filter: none; }
      .name-panel { min-height: 82px; padding: 8px 5px 10px; }
      .ruby-name { gap: 2px; }
      .annotated-character { grid-template-columns: auto 1.2rem; }
      .hanzi { font-size: 1.5rem; }
      .phonetic { height: 3rem; grid-template-columns: .7rem .5rem; }
      .phonetic-symbols { font-size: .75rem; }
      .tone { font-size: .9rem; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-badge" aria-hidden="true">注</div>
        <div class="header-copy">
          <h1>寶可夢注音圖鑑</h1>
          <p>看圖片、認名字，逐字練習正確讀音</p>
        </div>
      </div>
      <div class="collection-count" aria-label="題庫收錄數量"><strong id="totalCount">—</strong>隻寶可夢</div>
    </div>
  </header>

  <main class="page-shell">
    <section class="toolbar" aria-label="題目設定">
      <div class="field field-search">
        <label for="searchInput">搜尋寶可夢</label>
        <input id="searchInput" type="search" placeholder="例如：皮卡丘" autocomplete="off">
      </div>
      <div class="field">
        <label for="generationSelect">選擇世代</label>
        <select id="generationSelect">
          <option value="all">全部世代</option><option value="1">第一世代</option><option value="2">第二世代</option>
          <option value="3">第三世代</option><option value="4">第四世代</option><option value="5">第五世代</option>
          <option value="6">第六世代</option><option value="7">第七世代</option><option value="8">第八世代</option><option value="9">第九世代</option>
        </select>
      </div>
      <div class="field">
        <label for="countSelect">每次題數</label>
        <select id="countSelect"><option value="6">6 題</option><option value="9" selected>9 題</option><option value="12">12 題</option><option value="18">18 題</option></select>
      </div>
      <button class="button button-primary" id="shuffleButton" type="button">↻ 換一批</button>
      <button class="button button-secondary" id="toggleButton" type="button" aria-pressed="false">遮住注音</button>
      <button class="button button-print" id="printButton" type="button">列印學習單</button>
    </section>

    <section aria-labelledby="worksheetTitle">
      <div class="worksheet-head">
        <div>
          <h2 id="worksheetTitle">看圖讀出寶可夢名稱</h2>
          <p>每個中文字的右側，都是它自己的直式注音與聲調。</p>
        </div>
        <div class="batch-summary" id="batchSummary" aria-live="polite">準備題目中</div>
      </div>
      <div class="pokemon-grid" id="pokemonGrid" aria-live="polite"><div class="loading-state">正在打開寶可夢圖鑑⋯⋯</div></div>
    </section>

    <aside class="learning-note">
      <span aria-hidden="true">💡</span>
      <div><strong>練習方法：</strong>先按「遮住注音」自己念一次，再顯示注音核對；按「換一批」可繼續挑戰。</div>
    </aside>
  </main>

  <script>
    const generationRanges = [
      [1, 151], [152, 251], [252, 386], [387, 493], [494, 649],
      [650, 721], [722, 809], [810, 905], [906, 1025]
    ];

    const state = { data: [], batch: [], generation: 'all', count: 9, query: '', zhuyinHidden: false };
    const elements = {
      totalCount: document.getElementById('totalCount'), search: document.getElementById('searchInput'),
      generation: document.getElementById('generationSelect'), count: document.getElementById('countSelect'),
      shuffle: document.getElementById('shuffleButton'), toggle: document.getElementById('toggleButton'),
      print: document.getElementById('printButton'), summary: document.getElementById('batchSummary'),
      grid: document.getElementById('pokemonGrid')
    };

    function escapeHtml(value) {
      return String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    function generationOf(id) {
      return generationRanges.findIndex(([start, end]) => id >= start && id <= end) + 1;
    }

    function artworkPath(entry) {
      return `assets/pokemon/gen${generationOf(entry.id)}/${String(entry.id).padStart(3, '0')}.png`;
    }

    function splitSyllable(value) {
      const match = value.match(/^(.*?)([ˊˇˋ˙])?$/u);
      return { symbols: match?.[1] || value, tone: match?.[2] || '' };
    }

    function renderAnnotatedName(entry) {
      const characters = [...entry.name];
      const syllables = entry.zhuyin.trim().split(/\s+/u);
      const label = `${entry.name}，${entry.zhuyin}`;
      const content = characters.map((character, index) => {
        const { symbols, tone } = splitSyllable(syllables[index] || '');
        const toneClass = tone === '˙' ? 'tone tone-light' : tone ? 'tone' : 'tone tone-empty';
        return `<span class="annotated-character" aria-hidden="true"><span class="hanzi">${escapeHtml(character)}</span><span class="phonetic"><span class="phonetic-symbols">${escapeHtml(symbols)}</span><span class="${toneClass}">${escapeHtml(tone || 'ˉ')}</span></span></span>`;
      }).join('');
      return `<div class="ruby-name" role="text" aria-label="${escapeHtml(label)}">${content}</div>`;
    }

    function shuffled(items) {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const target = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[target]] = [copy[target], copy[index]];
      }
      return copy;
    }

    function filteredPokemon() {
      const query = state.query.trim();
      return state.data.filter((entry) => {
        const generationMatches = state.generation === 'all' || generationOf(entry.id) === Number(state.generation);
        const nameMatches = !query || entry.name.includes(query) || String(entry.id).includes(query);
        return generationMatches && nameMatches;
      });
    }

    function chooseBatch() {
      const pool = filteredPokemon();
      state.batch = shuffled(pool).slice(0, state.count);
      render();
    }

    function render() {
      const poolSize = filteredPokemon().length;
      const generationLabel = state.generation === 'all' ? '全部世代' : `第 ${state.generation} 世代`;
      elements.summary.textContent = `${generationLabel}・顯示 ${state.batch.length}／${poolSize} 隻`;
      if (!state.batch.length) {
        elements.grid.innerHTML = `<div class="empty-state">找不到符合條件的寶可夢，請換個名稱或世代。</div>`;
        return;
      }
      elements.grid.innerHTML = state.batch.map((entry) => {
        const generation = generationOf(entry.id);
        return `<article class="pokemon-card"><div class="card-meta"><span class="dex-number">全國圖鑑 #${String(entry.id).padStart(4, '0')}</span><span>第 ${generation} 世代</span></div><div class="artwork-wrap"><img src="${artworkPath(entry)}" alt="${escapeHtml(entry.name)}" loading="lazy"></div><div class="name-panel">${renderAnnotatedName(entry)}</div></article>`;
      }).join('');
    }

    elements.search.addEventListener('input', (event) => { state.query = event.target.value; chooseBatch(); });
    elements.generation.addEventListener('change', (event) => { state.generation = event.target.value; chooseBatch(); });
    elements.count.addEventListener('change', (event) => { state.count = Number(event.target.value); chooseBatch(); });
    elements.shuffle.addEventListener('click', chooseBatch);
    elements.toggle.addEventListener('click', () => {
      state.zhuyinHidden = !state.zhuyinHidden;
      document.body.classList.toggle('zhuyin-hidden', state.zhuyinHidden);
      elements.toggle.textContent = state.zhuyinHidden ? '顯示注音' : '遮住注音';
      elements.toggle.setAttribute('aria-pressed', String(state.zhuyinHidden));
    });
    elements.print.addEventListener('click', () => window.print());

    async function start() {
      try {
        const response = await fetch('pokemon-zhuyin.json');
        if (!response.ok) throw new Error('題庫讀取失敗');
        state.data = await response.json();
        elements.totalCount.textContent = state.data.length.toLocaleString('zh-TW');
        chooseBatch();
      } catch (error) {
        elements.summary.textContent = '無法載入題庫';
        elements.grid.innerHTML = `<div class="empty-state">寶可夢題庫暫時無法載入，請重新整理頁面。</div>`;
      }
    }

    start();
  </script>
</body>
</html>
