<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="用寶可夢圖片與逐字直式注音，練習辨認和朗讀寶可夢名稱。">
  <title>寶可夢注音圖鑑</title>
  <link rel="preload" href="assets/fonts/iansui-pokemon.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Iansui Pokemon";
      src: url("assets/fonts/iansui-pokemon.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    :root {
      --red: #e33536;
      --red-dark: #b91c2a;
      --blue: #2368b5;
      --blue-dark: #123d72;
      --yellow: #ffcb05;
      --ink: #15243a;
      --muted: #637083;
      --line: #d9e2ef;
      --paper: #ffffff;
      --surface: #f3f7fc;
      --shadow: 0 14px 36px rgba(25, 54, 94, .12);
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 6%, rgba(255, 203, 5, .2), transparent 21rem),
        radial-gradient(circle at 92% 0%, rgba(35, 104, 181, .13), transparent 24rem),
        var(--surface);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      font-size: 16px;
    }

    button, input, select { font: inherit; }
    button, select { cursor: pointer; }
    img { display: block; max-width: 100%; }

    .app-header {
      color: #fff;
      background: linear-gradient(120deg, #c91f31 0%, var(--red) 52%, #ef5361 100%);
      border-bottom: 7px solid var(--yellow);
    }

    .header-inner, .page-shell {
      width: min(1180px, calc(100% - 32px));
      margin-inline: auto;
    }

    .header-inner {
      min-height: 108px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding-block: 20px;
    }

    .brand { display: flex; align-items: center; gap: 16px; }

    .brand-badge {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 4px solid #fff;
      border-radius: 18px;
      color: var(--blue-dark);
      background: var(--yellow);
      box-shadow: 0 7px 0 rgba(85, 10, 24, .25);
      font-size: 30px;
      font-weight: 1000;
      transform: rotate(-3deg);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3.8vw, 2.45rem);
      line-height: 1.15;
      letter-spacing: .04em;
    }

    .header-copy p {
      margin: 7px 0 0;
      color: rgba(255, 255, 255, .88);
      font-size: .98rem;
    }

    .collection-count {
      min-width: 140px;
      padding: 11px 16px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 16px;
      background: rgba(101, 8, 24, .19);
      text-align: center;
      font-weight: 800;
      white-space: nowrap;
    }

    .collection-count strong {
      display: block;
      color: var(--yellow);
      font-size: 1.45rem;
      line-height: 1.1;
    }

    .page-shell { padding: 28px 0 52px; }

    .toolbar {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(190px, 1.25fr) repeat(2, minmax(130px, .7fr)) auto auto;
      gap: 12px;
      align-items: end;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255,255,255,.94);
      box-shadow: var(--shadow);
    }

    .field { display: grid; gap: 6px; }

    .field label {
      color: var(--blue-dark);
      font-size: .88rem;
      font-weight: 900;
    }

    input, select, .button { min-height: 46px; border-radius: 12px; outline: none; }

    input, select {
      width: 100%;
      padding: 0 13px;
      border: 2px solid #cbd7e6;
      color: var(--ink);
      background: #fff;
    }

    input:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(35, 104, 181, .13);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 15px;
      border: 2px solid transparent;
      font-weight: 900;
      white-space: nowrap;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .button:hover { transform: translateY(-2px); }
    .button:focus-visible { outline: 4px solid rgba(35,104,181,.25); outline-offset: 2px; }

    .button-primary { color: #fff; background: var(--blue); box-shadow: 0 5px 0 var(--blue-dark); }
    .button-secondary { color: var(--blue-dark); border-color: #bfd0e5; background: #eef5fd; }
    .button-print { color: #fff; background: var(--red); box-shadow: 0 5px 0 var(--red-dark); }

    .button:disabled { cursor: not-allowed; opacity: .48; transform: none; }

    .worksheet-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 30px 2px 18px;
    }

    .worksheet-head h2 {
      margin: 0;
      font-size: clamp(1.35rem, 2vw, 1.8rem);
      color: var(--blue-dark);
    }

    .worksheet-head p { margin: 5px 0 0; color: var(--muted); line-height: 1.55; }

    .batch-summary {
      flex: 0 0 auto;
      padding: 8px 13px;
      border-radius: 999px;
      color: #8f2330;
      background: #ffe8ea;
      font-size: .9rem;
      font-weight: 900;
    }

    .worksheet-sheet {
      margin-top: 24px;
      padding: 0 22px 28px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255,255,255,.72);
      box-shadow: var(--shadow);
    }

    .worksheet-sheet .worksheet-head { margin-top: 0; padding-top: 22px; }

    .student-fields {
      display: flex;
      justify-content: flex-end;
      gap: 28px;
      margin: -4px 2px 20px;
      color: #45546a;
      font-weight: 800;
    }

    .exercise-section + .exercise-section { margin-top: 26px; }

    .exercise-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 11px;
    }

    .exercise-heading > span {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 11px;
      color: #fff;
      background: var(--blue);
      font-weight: 1000;
    }

    .exercise-heading h3 { margin: 0; color: var(--blue-dark); font-size: 1.15rem; }
    .exercise-heading p { margin: 2px 0 0; color: var(--muted); font-size: .86rem; }

    .pokemon-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .exercise-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .pokemon-card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-top: 5px solid var(--red);
      border-radius: 21px;
      background: var(--paper);
      box-shadow: 0 9px 24px rgba(24, 51, 86, .09);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .pokemon-card:hover { transform: translateY(-4px); box-shadow: 0 15px 30px rgba(24, 51, 86, .14); }

    .question-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 21px;
      background: #fff;
      box-shadow: 0 9px 24px rgba(24, 51, 86, .09);
    }

    .question-card.is-correct { border-color: #159468; box-shadow: 0 0 0 3px rgba(21,148,104,.14); }
    .question-card.is-wrong { border-color: var(--red); box-shadow: 0 0 0 3px rgba(227,53,54,.12); }

    .question-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      color: #435168;
      background: #edf4fc;
      font-size: .86rem;
      font-weight: 900;
    }

    .quiz-prompt {
      min-height: 148px;
      display: grid;
      place-items: center;
      padding: 15px;
    }

    .quiz-art { width: 112px; height: 112px; object-fit: contain; filter: drop-shadow(0 7px 6px rgba(25,44,71,.12)); }

    .pronunciation-prompt {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 18px;
      border-radius: 18px;
      background: #eef5fd;
    }

    .pronunciation-prompt .phonetic { height: 5.2rem; transform: scale(1.35); }

    .hanzi-only-name {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 18px;
      background: #fff7e7;
    }

    .phonetic-choice-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .phonetic-choice-row .phonetic { height: 3.7rem; }

    .toneless-prompt {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 18px;
      background: #f3efff;
    }

    .toneless-prompt .hanzi-only-name { padding: 0; background: transparent; }
    .toneless-prompt .prompt-divider { width: 2px; height: 48px; background: #cfc4ea; }
    .toneless-prompt .phonetic-choice-row .phonetic { height: 4rem; }

    .writing-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 21px;
      background: #fff;
      box-shadow: 0 9px 24px rgba(24, 51, 86, .09);
    }

    .writing-body {
      min-height: 148px;
      display: grid;
      grid-template-columns: 88px 1fr;
      align-items: center;
      gap: 12px;
      padding: 12px 16px 16px;
    }

    .writing-art { width: 82px; height: 82px; object-fit: contain; }
    .writing-name { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; }

    .writing-character {
      display: inline-grid;
      grid-template-columns: auto 2.2rem;
      align-items: center;
      gap: 3px;
    }

    .zhuyin-writing-slot {
      width: 2.1rem;
      height: 5.25rem;
      display: grid;
      grid-template-columns: 1.25rem .65rem;
      gap: 2px;
    }

    .symbol-writing-box, .tone-writing-box {
      border: 2px dashed #a9b9cd;
      border-radius: 7px;
      background: repeating-linear-gradient(to bottom, transparent 0 31%, rgba(35,104,181,.12) 32% 34%, transparent 35% 65%, rgba(35,104,181,.12) 66% 68%, transparent 69% 100%);
    }

    .tone-writing-box { height: 2rem; align-self: center; background: none; }

    .choice-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      padding: 0 14px 15px;
    }

    .choice {
      min-height: 54px;
      display: grid;
      place-items: center;
      padding: 8px;
      border: 2px solid #cbd7e6;
      border-radius: 12px;
      color: var(--ink);
      background: #fff;
      font-weight: 900;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }

    .choice:hover:not(:disabled) { border-color: var(--blue); background: #f1f6fd; transform: translateY(-2px); }
    .choice:focus-visible { outline: 4px solid rgba(35,104,181,.2); outline-offset: 1px; }
    .choice:disabled { cursor: default; color: inherit; opacity: 1; }
    .choice.is-correct { border-color: #159468; color: #086b4a; background: #e8faf3; }
    .choice.is-wrong { border-color: var(--red); color: #a51d2c; background: #fff0f1; }
    .choice-image { min-height: 78px; }
    .choice-image img { width: 62px; height: 62px; object-fit: contain; }
    .choice .ruby-name { gap: 2px; }
    .choice .annotated-character { grid-template-columns: auto 1rem; }
    .choice .hanzi { font-size: 1.25rem; }
    .choice .phonetic { width: 1rem; height: 2.65rem; grid-template-columns: .6rem .4rem; }
    .choice .phonetic-symbols { font-size: .64rem; }
    .choice .tone { font-size: .72rem; }

    .answer-feedback {
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px 11px;
      font-weight: 900;
    }

    .answer-feedback.correct { color: #08704d; }
    .answer-feedback.wrong { color: var(--red-dark); }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px 0;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 900;
      letter-spacing: .03em;
    }

    .dex-number { color: var(--red-dark); }

    .artwork-wrap {
      height: 124px;
      display: grid;
      place-items: center;
      padding: 4px 18px 0;
      background: radial-gradient(circle, #f8fbff 0 43%, transparent 44%);
    }

    .artwork-wrap img {
      width: 112px;
      height: 112px;
      object-fit: contain;
      filter: drop-shadow(0 10px 7px rgba(25, 44, 71, .13));
    }

    .name-panel {
      min-height: 132px;
      display: grid;
      place-items: center;
      padding: 15px 12px 20px;
      border-top: 1px dashed #c9d5e4;
      background: linear-gradient(#fff, #fbfdff);
    }

    .ruby-name {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      max-width: 100%;
    }

    .annotated-character {
      display: inline-grid;
      grid-template-columns: auto 1.9rem;
      align-items: center;
      column-gap: 2px;
    }

    .hanzi {
      color: #111827;
      font-family: "Iansui Pokemon", "BiauKai", "DFKai-SB", "標楷體", cursive;
      font-size: clamp(2rem, 3vw, 2.4rem);
      font-weight: 400;
      font-synthesis: none;
      line-height: 1;
      white-space: nowrap;
    }

    .phonetic {
      height: 5rem;
      display: grid;
      grid-template-columns: 1rem .78rem;
      align-items: center;
      justify-content: start;
      color: var(--blue);
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-weight: 900;
    }

    .phonetic-symbols {
      justify-self: center;
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 1.22rem;
      line-height: .95;
      letter-spacing: .03em;
    }

    .tone {
      align-self: center;
      justify-self: start;
      color: var(--red);
      font-size: 1.48rem;
      font-weight: 1000;
      line-height: 1;
    }

    .tone-light { align-self: start; margin-top: .18rem; }
    .tone-empty { visibility: hidden; }
    body.zhuyin-hidden .phonetic { visibility: hidden; }

    .empty-state, .loading-state {
      grid-column: 1 / -1;
      min-height: 300px;
      display: grid;
      place-items: center;
      padding: 32px;
      border: 2px dashed #bdcadb;
      border-radius: 22px;
      color: var(--muted);
      background: rgba(255,255,255,.72);
      text-align: center;
      font-weight: 800;
    }

    .learning-note {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
      padding: 14px 17px;
      border-left: 5px solid var(--yellow);
      border-radius: 12px;
      color: #34445a;
      background: #fff;
      box-shadow: 0 7px 18px rgba(24, 51, 86, .06);
      line-height: 1.55;
    }

    .learning-note strong { color: var(--blue-dark); }

    @media (max-width: 980px) {
      .toolbar { grid-template-columns: repeat(3, 1fr); }
      .pokemon-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .header-inner, .page-shell { width: min(100% - 22px, 1180px); }
      .header-inner { min-height: auto; align-items: flex-start; }
      .brand-badge { width: 48px; height: 48px; border-radius: 14px; font-size: 25px; }
      .header-copy p { font-size: .9rem; }
      .collection-count { display: none; }
      .page-shell { padding-top: 18px; }
      .toolbar { grid-template-columns: 1fr 1fr; padding: 14px; }
      .field-search { grid-column: 1 / -1; }
      .button { padding-inline: 10px; }
      .worksheet-head { align-items: flex-start; flex-direction: column; margin-top: 24px; }
      .pokemon-grid { grid-template-columns: 1fr; }
      .worksheet-sheet { margin-top: 18px; padding: 0 11px 20px; border-radius: 18px; }
      .student-fields { flex-direction: column; gap: 7px; margin-bottom: 18px; }
      .artwork-wrap { height: 126px; }
      .artwork-wrap img { width: 112px; height: 112px; }
      .hanzi { font-size: 2.5rem; }
      .choice .hanzi { font-size: 1.25rem; }
    }

    @media print {
      @page { size: A4 portrait; margin: 7mm; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      html, body { width: 100%; min-height: 100%; background: #fff; }
      .app-header, .toolbar, .learning-note { display: none !important; }
      .page-shell { width: 100%; padding: 0; }
      .worksheet-sheet {
        width: 100%;
        height: 282mm;
        display: grid;
        grid-template-rows: auto auto repeat(5, minmax(0, 1fr));
        gap: 1.5mm;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        background: #fff;
      }
      .worksheet-sheet .worksheet-head { margin: 0; padding: 0 0 1.2mm; border-bottom: 2px solid var(--red); }
      .worksheet-head h2 { font-size: 1.12rem; }
      .worksheet-head p { display: none; }
      .batch-summary { padding: 4px 9px; font-size: .72rem; }
      .student-fields { align-items: center; margin: 0; gap: 24px; font-size: .78rem; }
      .exercise-section {
        min-height: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
      }
      .exercise-section + .exercise-section { margin-top: 0; }
      .exercise-heading { gap: 6px; margin-bottom: .7mm; }
      .exercise-heading > span { width: 20px; height: 20px; border-radius: 5px; font-size: .68rem; }
      .exercise-heading h3 { font-size: .88rem; }
      .exercise-heading p { display: none; }
      .pokemon-grid { height: 100%; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.5mm; }
      #studyGrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      body[data-print-count="1"] .pokemon-grid { grid-template-columns: 1fr; }
      body[data-print-count="1"] #studyGrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .pokemon-card {
        height: 100%;
        display: grid;
        grid-template-rows: auto 38px minmax(0, 1fr);
        break-inside: avoid;
        box-shadow: none;
        border-top-width: 3px;
        border-radius: 10px;
      }
      .pokemon-card:hover { transform: none; }
      .card-meta { padding: 2px 7px 0; font-size: .52rem; }
      .artwork-wrap { height: 38px; padding: 0; }
      .artwork-wrap img { width: 36px; height: 36px; filter: none; }
      .name-panel { min-height: 0; padding: 2px 4px 4px; }
      .ruby-name { flex-wrap: nowrap; gap: 2px; }
      .annotated-character { grid-template-columns: auto 1.02rem; }
      .hanzi { font-size: 1rem; }
      .phonetic { height: 2.75rem; grid-template-columns: .61rem .39rem; }
      .phonetic-symbols { font-size: .68rem; }
      .tone { font-size: .84rem; }
      .question-card {
        height: 100%;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        break-inside: avoid;
        border-radius: 9px;
        box-shadow: none;
      }
      .question-heading { padding: 2px 7px; font-size: .58rem; }
      .quiz-prompt { min-height: 0; padding: 2px; }
      .quiz-art { width: 38px; height: 38px; filter: none; }
      .writing-card {
        height: 100%;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        break-inside: avoid;
        border-radius: 9px;
        box-shadow: none;
      }
      .writing-body { min-height: 0; grid-template-columns: 38px 1fr; gap: 5px; padding: 2px 7px 4px; }
      .writing-art { width: 36px; height: 36px; }
      .writing-name { flex-wrap: nowrap; gap: 2px; }
      .writing-character { grid-template-columns: auto 1.08rem; gap: 1px; }
      .zhuyin-writing-slot { width: 1.05rem; height: 2.8rem; grid-template-columns: .63rem .36rem; gap: 1px; }
      .symbol-writing-box, .tone-writing-box { border-width: 1.5px; border-radius: 4px; }
      .tone-writing-box { height: 1.05rem; }
      .pronunciation-prompt { gap: 5px; padding: 3px 7px; border-radius: 6px; }
      .pronunciation-prompt .phonetic { height: 2.85rem; transform: scale(1.04); }
      .hanzi-only-name { gap: 3px; padding: 3px 8px; border-radius: 6px; }
      .hanzi-only-name .hanzi { font-size: 1.12rem; }
      .toneless-prompt { gap: 6px; padding: 3px 7px; border-radius: 6px; }
      .toneless-prompt .prompt-divider { height: 32px; }
      .toneless-prompt .phonetic-choice-row .phonetic { height: 2.7rem; }
      .choice-list { gap: 3px; padding: 0 5px 4px; }
      .choice { min-height: 28px; padding: 2px; border-width: 1.25px; border-radius: 5px; }
      .choice-image { min-height: 34px; }
      .choice-image img { width: 29px; height: 29px; }
      .choice .hanzi { font-size: .67rem; }
      .choice .annotated-character { grid-template-columns: auto .59rem; }
      .choice .phonetic { width: .62rem; height: 1.78rem; grid-template-columns: .38rem .23rem; }
      .choice .phonetic-symbols { font-size: .43rem; }
      .choice .tone { font-size: .52rem; }
      .choice .phonetic-choice-row { gap: 2px; }
      .choice .phonetic-choice-row .phonetic { height: 2.08rem; }
      .answer-feedback { display: none; }
    }
  </style>
</head>
<body data-print-count="2">
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-badge" aria-hidden="true">注</div>
        <div class="header-copy">
          <h1>寶可夢注音圖鑑</h1>
          <p>以注音為主，搭配小圖辨認寶可夢名稱</p>
        </div>
      </div>
      <div class="collection-count" aria-label="題庫收錄數量"><strong id="totalCount">—</strong>隻寶可夢</div>
    </div>
  </header>

  <main class="page-shell">
    <section class="toolbar" aria-label="題目設定">
      <div class="field field-search">
        <label for="searchInput">搜尋寶可夢</label>
        <input id="searchInput" type="search" placeholder="例如：皮卡丘" autocomplete="off">
      </div>
      <div class="field">
        <label for="generationSelect">選擇世代</label>
        <select id="generationSelect">
          <option value="all">全部世代</option><option value="1">第一世代</option><option value="2">第二世代</option>
          <option value="3">第三世代</option><option value="4">第四世代</option><option value="5">第五世代</option>
          <option value="6">第六世代</option><option value="7">第七世代</option><option value="8">第八世代</option><option value="9">第九世代</option>
        </select>
      </div>
      <div class="field">
        <label for="countSelect">其他題型題數</label>
        <select id="countSelect"><option value="1">1 題</option><option value="2" selected>2 題</option></select>
      </div>
      <button class="button button-primary" id="shuffleButton" type="button">↻ 重新產生</button>
      <button class="button button-print" id="printButton" type="button" disabled>列印學習單</button>
    </section>

    <article class="worksheet-sheet" aria-labelledby="worksheetTitle">
      <div class="worksheet-head">
        <div>
          <h2 id="worksheetTitle">寶可夢注音綜合學習單</h2>
          <p>注音是學習重點，圖片只作為辨認提示。</p>
        </div>
        <div class="batch-summary" id="batchSummary" aria-live="polite">準備題目中</div>
      </div>
      <div class="student-fields"><span>姓名：________________</span><span>日期：________________</span></div>

      <section class="exercise-section" aria-labelledby="studyHeading">
        <div class="exercise-heading"><span>一</span><div><h3 id="studyHeading">看圖認讀</h3><p>看圖片，讀出寶可夢名稱。</p></div></div>
        <div class="pokemon-grid exercise-grid" id="studyGrid"><div class="loading-state">正在準備學習單⋯⋯</div></div>
      </section>

      <section class="exercise-section" aria-labelledby="pictureNameHeading">
        <div class="exercise-heading"><span>二</span><div><h3 id="pictureNameHeading">看圖選名字</h3><p>看圖片，圈出正確名稱。</p></div></div>
        <div class="pokemon-grid exercise-grid" id="pictureNameGrid"></div>
      </section>

      <section class="exercise-section" aria-labelledby="hanziZhuyinHeading">
        <div class="exercise-heading"><span>三</span><div><h3 id="hanziZhuyinHeading">看國字選注音</h3><p>看寶可夢名稱，圈出正確注音。</p></div></div>
        <div class="pokemon-grid exercise-grid" id="hanziZhuyinGrid"></div>
      </section>

      <section class="exercise-section" aria-labelledby="tonePracticeHeading">
        <div class="exercise-heading"><span>四</span><div><h3 id="tonePracticeHeading">分辨聲調</h3><p>讀一讀，圈出聲調正確的注音。</p></div></div>
        <div class="pokemon-grid exercise-grid" id="tonePracticeGrid"></div>
      </section>

      <section class="exercise-section" aria-labelledby="writeZhuyinHeading">
        <div class="exercise-heading"><span>五</span><div><h3 id="writeZhuyinHeading">看圖寫注音</h3><p>看名稱，在每個中文字右側寫上注音。</p></div></div>
        <div class="pokemon-grid exercise-grid" id="writeZhuyinGrid"></div>
      </section>
    </article>

    <aside class="learning-note">
      <span aria-hidden="true">💡</span>
      <div><strong>使用方式：</strong>完成四個區塊後可直接列印；按「重新產生」會一次更換整張學習單。</div>
    </aside>
  </main>

  <script>
    const generationRanges = [
      [1, 151], [152, 251], [252, 386], [387, 493], [494, 649],
      [650, 721], [722, 809], [810, 905], [906, 1025]
    ];

    const state = {
      data: [], sections: {}, quizItems: {}, answers: {},
      generation: 'all', count: 2, query: ''
    };
    const elements = {
      totalCount: document.getElementById('totalCount'), search: document.getElementById('searchInput'),
      generation: document.getElementById('generationSelect'), count: document.getElementById('countSelect'),
      shuffle: document.getElementById('shuffleButton'), print: document.getElementById('printButton'),
      summary: document.getElementById('batchSummary'),
      studyGrid: document.getElementById('studyGrid'),
      pictureNameGrid: document.getElementById('pictureNameGrid'),
      hanziZhuyinGrid: document.getElementById('hanziZhuyinGrid'),
      tonePracticeGrid: document.getElementById('tonePracticeGrid'),
      writeZhuyinGrid: document.getElementById('writeZhuyinGrid'),
      worksheet: document.querySelector('.worksheet-sheet')
    };

    function escapeHtml(value) {
      return String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    function generationOf(id) {
      return generationRanges.findIndex(([start, end]) => id >= start && id <= end) + 1;
    }

    function artworkPath(entry) {
      return `assets/pokemon/gen${generationOf(entry.id)}/${String(entry.id).padStart(3, '0')}.png`;
    }

    function splitSyllable(value) {
      const match = value.match(/^(.*?)([ˊˇˋ˙])?$/u);
      return { symbols: match?.[1] || value, tone: match?.[2] || '' };
    }

    function renderAnnotatedName(entry) {
      const characters = [...entry.name];
      const syllables = entry.zhuyin.trim().split(/\s+/u);
      const label = `${entry.name}，${entry.zhuyin}`;
      const content = characters.map((character, index) => {
        const { symbols, tone } = splitSyllable(syllables[index] || '');
        const toneClass = tone === '˙' ? 'tone tone-light' : tone ? 'tone' : 'tone tone-empty';
        return `<span class="annotated-character" aria-hidden="true"><span class="hanzi">${escapeHtml(character)}</span><span class="phonetic"><span class="phonetic-symbols">${escapeHtml(symbols)}</span><span class="${toneClass}">${escapeHtml(tone || 'ˉ')}</span></span></span>`;
      }).join('');
      return `<div class="ruby-name" role="text" aria-label="${escapeHtml(label)}">${content}</div>`;
    }

    function renderPhoneticPrompt(entry) {
      const syllables = entry.zhuyin.trim().split(/\s+/u);
      const content = syllables.map((syllable) => {
        const { symbols, tone } = splitSyllable(syllable);
        const toneClass = tone === '˙' ? 'tone tone-light' : tone ? 'tone' : 'tone tone-empty';
        return `<span class="phonetic" aria-hidden="true"><span class="phonetic-symbols">${escapeHtml(symbols)}</span><span class="${toneClass}">${escapeHtml(tone || 'ˉ')}</span></span>`;
      }).join('');
      return `<div class="pronunciation-prompt" role="text" aria-label="${escapeHtml(entry.zhuyin)}">${content}</div>`;
    }

    function renderHanziName(entry) {
      const content = [...entry.name].map((character) => `<span class="hanzi">${escapeHtml(character)}</span>`).join('');
      return `<div class="hanzi-only-name" role="text" aria-label="${escapeHtml(entry.name)}">${content}</div>`;
    }

    function renderPhoneticSequence(entry, tones = null) {
      const syllables = entry.zhuyin.trim().split(/\s+/u);
      const content = syllables.map((syllable, index) => {
        const { symbols, tone } = splitSyllable(syllable);
        const displayTone = tones ? tones[index] : (tone || 'ˉ');
        const toneClass = displayTone === '˙' ? 'tone tone-light' : 'tone';
        return `<span class="phonetic" aria-hidden="true"><span class="phonetic-symbols">${escapeHtml(symbols)}</span><span class="${toneClass}">${escapeHtml(displayTone)}</span></span>`;
      }).join('');
      return `<div class="phonetic-choice-row" role="text" aria-label="${escapeHtml(entry.zhuyin)}">${content}</div>`;
    }

    function renderTonelessPrompt(entry) {
      const syllables = entry.zhuyin.trim().split(/\s+/u);
      const symbols = syllables.map((syllable) => {
        const parsed = splitSyllable(syllable);
        return `<span class="phonetic" aria-hidden="true"><span class="phonetic-symbols">${escapeHtml(parsed.symbols)}</span><span class="tone tone-empty">ˉ</span></span>`;
      }).join('');
      return `<div class="toneless-prompt">${renderHanziName(entry)}<span class="prompt-divider" aria-hidden="true"></span><div class="phonetic-choice-row" aria-label="尚未標示聲調的注音">${symbols}</div></div>`;
    }

    function shuffled(items) {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const target = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[target]] = [copy[target], copy[index]];
      }
      return copy;
    }

    function optionEntries(correct) {
      const sameGeneration = state.data.filter((entry) => entry.id !== correct.id && generationOf(entry.id) === generationOf(correct.id));
      return shuffled([correct, ...shuffled(sameGeneration).slice(0, 2)]);
    }

    function buildQuizItems(type, entries) {
      return entries.map((entry, index) => ({ type, entry, options: optionEntries(entry), key: `${type}-${entry.id}-${index}` }));
    }

    const toneMarks = ['ˉ', 'ˊ', 'ˇ', 'ˋ', '˙'];

    function toneSignature(entry) {
      return entry.zhuyin.trim().split(/\s+/u).map((syllable) => splitSyllable(syllable).tone || 'ˉ');
    }

    function toneOptions(entry) {
      const correct = toneSignature(entry);
      const variants = new Map([[correct.join(''), correct]]);
      for (let offset = 1; variants.size < 3 && offset < toneMarks.length; offset += 1) {
        const variant = correct.map((tone, index) => toneMarks[(toneMarks.indexOf(tone) + offset + index) % toneMarks.length]);
        variants.set(variant.join(''), variant);
      }
      return shuffled([...variants.values()]);
    }

    function buildToneQuizItems(entries) {
      return entries.map((entry, index) => ({ type: 'tonePractice', entry, options: toneOptions(entry), key: `tonePractice-${entry.id}-${index}` }));
    }

    function filteredPokemon() {
      const query = state.query.trim();
      return state.data.filter((entry) => {
        const generationMatches = state.generation === 'all' || generationOf(entry.id) === Number(state.generation);
        const nameMatches = !query || entry.name.includes(query) || String(entry.id).includes(query);
        return generationMatches && nameMatches;
      });
    }

    function chooseBatch() {
      const pool = filteredPokemon();
      const picked = shuffled(pool);
      const studyCount = Math.min(3, picked.length);
      const group = (groupIndex) => Array.from({ length: Math.min(state.count, picked.length) }, (_, index) => picked[(studyCount + groupIndex * state.count + index) % picked.length]);
      state.sections = {
        study: picked.slice(0, studyCount),
        pictureName: group(0),
        hanziZhuyin: group(1),
        tonePractice: group(2),
        writeZhuyin: group(3)
      };
      state.quizItems = {
        pictureName: buildQuizItems('pictureName', state.sections.pictureName),
        hanziZhuyin: buildQuizItems('hanziZhuyin', state.sections.hanziZhuyin),
        tonePractice: buildToneQuizItems(state.sections.tonePractice)
      };
      state.answers = {};
      render();
    }

    function correctValue(item) {
      return item.type === 'tonePractice' ? toneSignature(item.entry).join('') : String(item.entry.id);
    }

    function answerDetails(item) {
      const selected = state.answers[item.key];
      const answered = selected !== undefined;
      return { selected, answered, correct: answered && selected === correctValue(item) };
    }

    function renderStudyCards(entries) {
      return entries.map((entry) => {
        const generation = generationOf(entry.id);
        return `<article class="pokemon-card"><div class="card-meta"><span class="dex-number">全國圖鑑 #${String(entry.id).padStart(4, '0')}</span><span>第 ${generation} 世代</span></div><div class="artwork-wrap"><img src="${artworkPath(entry)}" alt="${escapeHtml(entry.name)}" loading="eager" decoding="sync"></div><div class="name-panel">${renderAnnotatedName(entry)}</div></article>`;
      }).join('');
    }

    function renderWritingCards(entries) {
      return entries.map((entry, index) => {
        const characters = [...entry.name].map((character) => `<span class="writing-character"><span class="hanzi">${escapeHtml(character)}</span><span class="zhuyin-writing-slot" aria-label="在這裡寫注音"><span class="symbol-writing-box"></span><span class="tone-writing-box"></span></span></span>`).join('');
        return `<article class="writing-card"><div class="question-heading"><span>第 ${index + 1} 題</span><span>寫注音</span></div><div class="writing-body"><img class="writing-art" src="${artworkPath(entry)}" alt="${escapeHtml(entry.name)}" loading="eager" decoding="sync"><div class="writing-name">${characters}</div></div></article>`;
      }).join('');
    }

    function choiceClass(item, value) {
      const { answered, selected } = answerDetails(item);
      if (!answered) return 'choice';
      if (value === correctValue(item)) return 'choice is-correct';
      if (value === selected) return 'choice is-wrong';
      return 'choice';
    }

    function renderQuizCard(item, index) {
      const { answered, correct } = answerDetails(item);
      const cardClass = answered ? `question-card ${correct ? 'is-correct' : 'is-wrong'}` : 'question-card';
      let prompt = '';
      let choices = '';

      if (item.type === 'pictureName') {
        prompt = `<img class="quiz-art" src="${artworkPath(item.entry)}" alt="題目中的寶可夢" loading="eager" decoding="sync">`;
        choices = item.options.map((option) => `<button class="${choiceClass(item, String(option.id))}" type="button" data-question="${item.key}" data-answer="${option.id}" ${answered ? 'disabled' : ''}>${renderAnnotatedName(option)}</button>`).join('');
      }

      if (item.type === 'hanziZhuyin') {
        prompt = renderHanziName(item.entry);
        choices = item.options.map((option) => `<button class="${choiceClass(item, String(option.id))}" type="button" data-question="${item.key}" data-answer="${option.id}" aria-label="${escapeHtml(option.zhuyin)}" ${answered ? 'disabled' : ''}>${renderPhoneticSequence(option)}</button>`).join('');
      }

      if (item.type === 'tonePractice') {
        prompt = renderTonelessPrompt(item.entry);
        choices = item.options.map((tones) => {
          const value = tones.join('');
          return `<button class="${choiceClass(item, value)}" type="button" data-question="${item.key}" data-answer="${value}" aria-label="聲調選項 ${escapeHtml(value)}" ${answered ? 'disabled' : ''}>${renderPhoneticSequence(item.entry, tones)}</button>`;
        }).join('');
      }

      const feedback = answered
        ? `<div class="answer-feedback ${correct ? 'correct' : 'wrong'}">${correct ? '答對了！' : `再記一次：${escapeHtml(item.entry.name)}`}</div>`
        : '<div class="answer-feedback" aria-hidden="true">&nbsp;</div>';

      return `<article class="${cardClass}"><div class="question-heading"><span>第 ${index + 1} 題</span><span>${answered ? (correct ? '答對' : '再試試') : '請選答案'}</span></div><div class="quiz-prompt">${prompt}</div><div class="choice-list">${choices}</div>${feedback}</article>`;
    }

    function renderSummary(poolSize) {
      const generationLabel = state.generation === 'all' ? '全部世代' : `第 ${state.generation} 世代`;
      const allQuizItems = Object.values(state.quizItems).flat();
      const answeredItems = allQuizItems.filter((item) => state.answers[item.key] !== undefined);
      const correctCount = answeredItems.filter((item) => state.answers[item.key] === correctValue(item)).length;
      const totalQuestions = Object.values(state.sections).reduce((total, entries) => total + entries.length, 0);
      elements.summary.textContent = answeredItems.length
        ? `${generationLabel}・共 ${totalQuestions} 題・答對 ${correctCount}/${answeredItems.length}`
        : `${generationLabel}・共 ${totalQuestions} 題・題庫 ${poolSize} 隻`;
    }

    function render() {
      const poolSize = filteredPokemon().length;
      document.body.dataset.printCount = String(state.count);
      renderSummary(poolSize);
      if (!state.sections.study?.length) {
        elements.studyGrid.innerHTML = `<div class="empty-state">找不到符合條件的寶可夢，請換個名稱或世代。</div>`;
        elements.pictureNameGrid.innerHTML = '';
        elements.hanziZhuyinGrid.innerHTML = '';
        elements.tonePracticeGrid.innerHTML = '';
        elements.writeZhuyinGrid.innerHTML = '';
        return;
      }
      elements.studyGrid.innerHTML = renderStudyCards(state.sections.study);
      elements.pictureNameGrid.innerHTML = state.quizItems.pictureName.map(renderQuizCard).join('');
      elements.hanziZhuyinGrid.innerHTML = state.quizItems.hanziZhuyin.map(renderQuizCard).join('');
      elements.tonePracticeGrid.innerHTML = state.quizItems.tonePractice.map(renderQuizCard).join('');
      elements.writeZhuyinGrid.innerHTML = renderWritingCards(state.sections.writeZhuyin);
      updatePrintReadiness();
    }

    function updatePrintReadiness() {
      elements.print.disabled = true;
      const imageTasks = [...elements.worksheet.querySelectorAll('img')].map((image) => {
        if (image.complete) return image.decode?.().catch(() => {}) || Promise.resolve();
        return new Promise((resolve) => {
          image.addEventListener('load', resolve, { once: true });
          image.addEventListener('error', resolve, { once: true });
        });
      });
      const fontTask = document.fonts?.load('1rem "Iansui Pokemon"') || Promise.resolve();
      Promise.allSettled([fontTask, ...imageTasks]).then(() => { elements.print.disabled = false; });
    }

    elements.search.addEventListener('input', (event) => { state.query = event.target.value; chooseBatch(); });
    elements.generation.addEventListener('change', (event) => { state.generation = event.target.value; chooseBatch(); });
    elements.count.addEventListener('change', (event) => { state.count = Number(event.target.value); chooseBatch(); });
    elements.shuffle.addEventListener('click', chooseBatch);

    elements.worksheet.addEventListener('click', (event) => {
      const choice = event.target.closest('[data-question][data-answer]');
      if (!choice || choice.disabled) return;
      state.answers[choice.dataset.question] = choice.dataset.answer;
      render();
    });

    elements.print.addEventListener('click', () => window.print());

    async function start() {
      try {
        const response = await fetch('pokemon-zhuyin.json');
        if (!response.ok) throw new Error('題庫讀取失敗');
        state.data = await response.json();
        elements.totalCount.textContent = state.data.length.toLocaleString('zh-TW');
        chooseBatch();
      } catch (error) {
        elements.summary.textContent = '無法載入題庫';
        elements.studyGrid.innerHTML = `<div class="empty-state">寶可夢題庫暫時無法載入，請重新整理頁面。</div>`;
      }
    }

    start();
  </script>
</body>
