<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>結合韻學習單產生器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print { body{background:white!important}.no-print{display:none!important}.workspace{padding:0!important;display:block!important}.paper{width:210mm!important;min-height:297mm!important;margin:0!important;box-shadow:none!important;border:0!important} }
    .paper{width:210mm;min-height:297mm}.trace{color:transparent;-webkit-text-stroke:2px #cbd5e1}.trace-cell{background:linear-gradient(to bottom,transparent 49%,#dbeafe 50%,transparent 51%),linear-gradient(to right,transparent 49%,#dbeafe 50%,transparent 51%)}.choice.active{background:#0f766e;color:white;border-color:#0f766e;box-shadow:0 3px 0 #115e59;transform:translateY(-1px)}.choice{transition:.15s ease}.choice:hover{border-color:#5eead4;background:#f0fdfa}.choice.active:hover{background:#0f766e;color:white}
  </style>
</head>
<body class="bg-slate-100 text-slate-800">
  <div class="min-h-screen flex flex-col lg:flex-row">
    <aside class="no-print lg:w-[390px] shrink-0 bg-white border-r border-slate-200 p-5 lg:p-7 overflow-y-auto">
      <div class="mb-7"><div class="inline-flex rounded-full bg-teal-50 px-3 py-1 text-sm font-bold text-teal-700 mb-3">注音教學工具</div><h1 class="text-3xl font-black tracking-tight">結合韻學習單<br><span class="text-teal-600">線上產生器</span></h1><p class="mt-3 text-sm leading-6 text-slate-500">把「聲母＋韻母＋聲調」拆開練，再組合起來讀。選好條件後即可產生一張 A4 學習單。</p></div>
      <section class="space-y-6">
        <div><div class="flex items-center justify-between mb-2"><label class="font-bold">① 選擇結合韻</label><button id="allFinals" class="text-xs text-teal-700 font-bold">全選</button></div><div id="finals" class="grid grid-cols-4 gap-2"></div></div>
        <div><div class="flex items-center justify-between mb-2"><label class="font-bold">② 選擇起首音</label><button id="allInitials" class="text-xs text-teal-700 font-bold">全選</button></div><div id="initials" class="grid grid-cols-6 gap-2"></div></div>
        <div><label class="font-bold block mb-2">③ 聲調</label><div id="tones" class="grid grid-cols-5 gap-2"></div></div>
        <div class="rounded-2xl bg-amber-50 border border-amber-200 p-4"><label class="font-bold block mb-2">④ 每張學習單題數</label><input id="count" type="range" min="3" max="9" value="6" class="w-full accent-teal-600" /><div class="flex justify-between text-xs text-slate-500"><span>3 題</span><strong id="countLabel" class="text-amber-700">6 題</strong><span>9 題</span></div></div>
        <div class="flex gap-2 pt-1"><button id="generate" class="flex-1 rounded-xl bg-teal-700 hover:bg-teal-800 text-white font-bold py-3 shadow-sm">重新產生</button><button id="print" class="rounded-xl border border-slate-300 bg-white px-4 font-bold hover:bg-slate-50">列印</button></div>
        <div class="border-t border-slate-200 pt-5"><div class="flex items-center justify-between mb-2"><label class="font-bold">可愛詞語圖庫</label><span class="text-xs text-slate-400">AI 生成</span></div><div class="grid grid-cols-3 gap-2"><img class="rounded-xl bg-sky-50 p-1" src="assets/gallery/home.png" alt="家"><img class="rounded-xl bg-sky-50 p-1" src="assets/gallery/tooth.png" alt="牙"><img class="rounded-xl bg-sky-50 p-1" src="assets/gallery/bird.png" alt="鳥"><img class="rounded-xl bg-sky-50 p-1" src="assets/gallery/flower.png" alt="花"><img class="rounded-xl bg-sky-50 p-1" src="assets/gallery/moon.png" alt="月"><img class="rounded-xl bg-sky-50 p-1" src="assets/gallery/leaf.png" alt="葉"></div></div>
      </section>
    </aside>
    <main class="workspace flex-1 overflow-auto p-4 lg:p-10 flex justify-center"><article class="paper bg-white shadow-xl border border-slate-200 p-[13mm] relative overflow-hidden"><div class="absolute inset-[7mm] border-2 border-dashed border-teal-700/15 rounded-3xl pointer-events-none"></div><div class="relative z-10">
      <header class="flex justify-between items-start border-b-2 border-slate-800 pb-3 mb-5"><div><p class="text-sm font-bold text-teal-700 tracking-widest">注音符號練習</p><h2 class="text-3xl font-black mt-1">結合韻小達人</h2></div><div class="text-sm font-bold pt-2">姓名：<span class="inline-block w-28 border-b border-slate-600"></span></div></header>
      <div class="rounded-2xl bg-teal-50 border border-teal-100 px-5 py-3 mb-5 flex items-center justify-between"><div><p class="text-xs font-bold text-teal-700">今天練習</p><p id="summary" class="font-bold">聲母＋結合韻＋聲調</p></div><div class="text-3xl">✏️</div></div>
      <section class="mb-5"><div class="flex items-center gap-2 mb-2"><span class="rounded-full bg-amber-200 px-3 py-1 text-sm font-bold text-amber-900">一、看圖拼一拼</span><span class="text-xs text-slate-500">先看圖，再把聲母和結合韻合起來</span></div><div id="cards" class="grid grid-cols-3 gap-3"></div></section>
      <section class="mb-5"><div class="flex items-center gap-2 mb-2"><span class="rounded-full bg-sky-200 px-3 py-1 text-sm font-bold text-sky-900">二、描一描</span><span class="text-xs text-slate-500">在直式方格裡沿著灰色字練習</span></div><div id="traceGrid" class="grid grid-cols-3 gap-3"></div></section>
      <section class="mb-5"><div class="flex items-center gap-2 mb-2"><span class="rounded-full bg-rose-200 px-3 py-1 text-sm font-bold text-rose-900">三、找一找</span><span class="text-xs text-slate-500">把今天的結合韻圈起來</span></div><div id="bubbleGrid" class="grid grid-cols-6 gap-2 border-2 border-slate-200 rounded-2xl p-3"></div></section>
      <section><div class="flex items-center gap-2 mb-2"><span class="rounded-full bg-violet-200 px-3 py-1 text-sm font-bold text-violet-900">四、讀一讀</span><span class="text-xs text-slate-500">看圖念詞語，再把結合韻圈起來</span></div><div id="words" class="grid grid-cols-3 gap-3"></div></section>
      <footer class="mt-5 pt-3 border-t border-slate-200 flex justify-between text-xs text-slate-400"><span>我會把聲母和韻母拼在一起！</span><span>完成日期：＿＿＿＿</span></footer>
    </div></article></main>
  </div>
  <script>
    const finals=[
      ['ㄧㄚ',[['ㄐ','ㄐㄧㄚ','家','家','assets/gallery/home.png'],['ㄧ','ㄧㄚˊ','牙','牙','assets/gallery/tooth.png'],['ㄒ','ㄒㄧㄚˋ','下','下','']]],
      ['ㄧㄝ',[['ㄧ','ㄧㄝˇ','也','也',''],['ㄒ','ㄒㄧㄝˋ','謝','謝',''],['ㄐ','ㄐㄧㄝˇ','姐','姐','']]],
      ['ㄧㄠ',[['ㄧ','ㄧㄠˋ','要','要',''],['ㄋ','ㄋㄧㄠˇ','鳥','鳥','assets/gallery/bird.png'],['ㄐ','ㄐㄧㄠˇ','腳','腳','']]],
      ['ㄧㄡ',[['ㄧ','ㄧㄡˇ','有','有',''],['ㄋ','ㄋㄧㄡˊ','牛','牛',''],['ㄒ','ㄒㄧㄡˋ','秀','秀','']]],
      ['ㄧㄢ',[['ㄊ','ㄊㄧㄢ','天','天',''],['ㄑ','ㄑㄧㄢˊ','錢','錢',''],['ㄒ','ㄒㄧㄢˋ','線','線','']]],
      ['ㄧㄣ',[['ㄧ','ㄧㄣ','音','音',''],['ㄒ','ㄒㄧㄣ','心','心',''],['ㄐ','ㄐㄧㄣ','金','金','']]],
      ['ㄧㄤ',[['ㄧ','ㄧㄤˊ','羊','羊',''],['ㄒ','ㄒㄧㄤ','香','香',''],['ㄐ','ㄐㄧㄤ','江','江','']]],
      ['ㄧㄥ',[['ㄒ','ㄒㄧㄥ','星','星',''],['ㄅ','ㄅㄧㄥ','冰','冰',''],['ㄐ','ㄐㄧㄥ','京','京','']]],
      ['ㄨㄚ',[['ㄏ','ㄏㄨㄚ','花','花','assets/gallery/flower.png'],['ㄍ','ㄍㄨㄚ','瓜','瓜',''],['ㄓ','ㄓㄨㄚ','抓','抓','']]],
      ['ㄨㄛ',[['ㄨ','ㄨㄛˇ','我','我',''],['ㄍ','ㄍㄨㄛˊ','國','國',''],['ㄏ','ㄏㄨㄛˇ','火','火','']]],
      ['ㄨㄞ',[['ㄨ','ㄨㄞ','歪','歪',''],['ㄍ','ㄍㄨㄞˋ','怪','怪',''],['ㄎ','ㄎㄨㄞˋ','快','快','']]],
      ['ㄨㄟ',[['ㄏ','ㄏㄨㄟˊ','回','回',''],['ㄍ','ㄍㄨㄟ','龜','龜',''],['ㄨ','ㄨㄟˋ','味','味','']]],
      ['ㄨㄢ',[['ㄨ','ㄨㄢˊ','玩','玩',''],['ㄍ','ㄍㄨㄢ','關','關',''],['ㄏ','ㄏㄨㄢˊ','還','還','']]],
      ['ㄨㄣ',[['ㄨ','ㄨㄣˊ','文','文',''],['ㄨ','ㄨㄣˋ','問','問',''],['ㄍ','ㄍㄨㄣˇ','滾','滾','']]],
      ['ㄨㄤ',[['ㄨ','ㄨㄤˊ','王','王',''],['ㄍ','ㄍㄨㄤ','光','光',''],['ㄏ','ㄏㄨㄤˊ','黃','黃','']]],
      ['ㄨㄥ',[['ㄨ','ㄨㄥ','翁','翁',''],['ㄍ','ㄍㄨㄥ','公','公',''],['ㄓ','ㄓㄨㄥ','中','中','']]],
      ['ㄩㄝ',[['ㄩ','ㄩㄝˋ','月','月','assets/gallery/moon.png'],['ㄒ','ㄒㄩㄝˊ','學','學',''],['ㄐ','ㄐㄩㄝˊ','決','決','']]],
      ['ㄩㄢ',[['ㄩ','ㄩㄢˊ','圓','圓',''],['ㄒ','ㄒㄩㄢˇ','選','選',''],['ㄐ','ㄐㄩㄢˋ','卷','卷','']]],
      ['ㄩㄣ',[['ㄩ','ㄩㄣˊ','雲','雲',''],['ㄑ','ㄑㄩㄣˊ','群','群',''],['ㄒ','ㄒㄩㄣˊ','尋','尋','']]],
      ['ㄩㄥ',[['ㄩ','ㄩㄥˇ','永','永',''],['ㄩ','ㄩㄥˋ','用','用',''],['ㄒ','ㄒㄩㄥˊ','熊','熊','']]]
    ];
    const initials='ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ'.split('');
    const toneOptions=[['不限聲調',null],['一聲',''],['二聲','ˊ'],['三聲','ˇ'],['四聲','ˋ']];let selectedFinals=new Set(['ㄧㄚ','ㄧㄝ','ㄧㄠ','ㄧㄡ','ㄨㄚ','ㄨㄛ','ㄨㄟ','ㄨㄢ','ㄩㄝ','ㄩㄢ']),selectedInitials=new Set(['ㄧ','ㄋ','ㄐ','ㄒ','ㄍ','ㄏ','ㄨ']),selectedTone=null;let questions=[];const $=id=>document.getElementById(id);
    function choice(text,active,click){const b=document.createElement('button');b.className='choice border border-slate-200 rounded-lg py-2 text-sm font-bold bg-slate-50';b.textContent=text;if(active)b.classList.add('active');b.onclick=click;return b}
    function renderControls(){$('finals').innerHTML='';finals.forEach(f=>$('finals').append(choice(f[0],selectedFinals.has(f[0]),()=>{selectedFinals.has(f[0])?selectedFinals.delete(f[0]):selectedFinals.add(f[0]);renderControls();generate()})));$('initials').innerHTML='';initials.forEach(i=>$('initials').append(choice(i,selectedInitials.has(i),()=>{selectedInitials.has(i)?selectedInitials.delete(i):selectedInitials.add(i);renderControls();generate()})));$('tones').innerHTML='';toneOptions.forEach(t=>$('tones').append(choice(t[0],selectedTone===t[1],()=>{selectedTone=t[1];renderControls();generate()})))}
    const allEntries=()=>finals.flatMap(f=>f[1].map(e=>({final:f[0],initial:e[0],syllable:e[1],word:e[2],reading:e[3],image:e[4]})));
    function makeQuestions(){let pool=allEntries().filter(e=>selectedFinals.has(e.final)&&selectedInitials.has(e.initial)&&(selectedTone===null||e.syllable.endsWith(selectedTone)));if(!pool.length)pool=allEntries().filter(e=>selectedFinals.has(e.final)&&(selectedTone===null||e.syllable.endsWith(selectedTone)));if(!pool.length)pool=allEntries();pool.sort(()=>Math.random()-.5);questions=pool.slice(0,Number($('count').value));}
    function generate(){makeQuestions();const targets=[...new Set(questions.map(q=>q.final))];$('summary').textContent=`合法音節 ${targets.join('、')}　共 ${questions.length} 題`;$('cards').innerHTML=questions.map(q=>`<div class="border-2 border-slate-200 rounded-xl p-3 text-center"><div class="h-20 flex items-center justify-center mb-1">${q.image?`<img class="h-20 w-20 object-contain" src="${q.image}" alt="${q.word}">`:'<span class="text-4xl">🔤</span>'}</div><div class="font-black text-lg">${q.word}</div><div class="text-xl font-black mt-1"><span class="text-teal-700">${q.initial}</span> <span class="text-amber-600">＋ ${q.final}</span></div><div class="text-3xl font-black mt-1 tracking-widest">${q.syllable}</div><div class="mt-2 border-t border-dashed border-slate-300 pt-2 text-xs text-slate-500">我會拼：＿＿＿＿</div></div>`).join('');$('traceGrid').innerHTML=questions.map(q=>`<div class="trace-cell h-28 border-2 border-dashed border-slate-300 rounded-xl flex items-center justify-center"><span class="trace text-5xl font-black">${q.syllable}</span></div>`).join('');const distractors=allEntries().map(e=>e.final).filter(x=>!targets.includes(x));const bubbles=[...targets,...[...new Set(distractors)].sort(()=>Math.random()-.5).slice(0,Math.max(18-targets.length,0))].sort(()=>Math.random()-.5);$('bubbleGrid').innerHTML=bubbles.map(x=>`<div class="h-11 rounded-full border-2 border-slate-300 flex items-center justify-center font-black text-lg">${x}</div>`).join('');$('words').innerHTML=questions.slice(0,3).map(q=>`<div class="rounded-xl bg-slate-50 border border-slate-200 p-3 flex items-center gap-3">${q.image?`<img class="w-14 h-14 object-contain" src="${q.image}" alt="${q.word}">`:'<div class="text-3xl">✏️</div>'}<div><div class="font-black text-lg">${q.word}</div><div class="text-sm text-slate-500 tracking-widest">${q.syllable}</div><div class="text-xs mt-1">圈出：<span class="font-bold">${q.final}</span></div></div></div>`).join('')}
    $('allFinals').onclick=()=>{selectedFinals=new Set(finals.map(f=>f[0]));renderControls();generate()};$('allInitials').onclick=()=>{selectedInitials=new Set(initials);renderControls();generate()};$('generate').onclick=generate;$('print').onclick=()=>window.print();$('count').oninput=()=>{$('countLabel').textContent=`${$('count').value} 題`;generate()};renderControls();generate();
  </script>
</body>
</html>
