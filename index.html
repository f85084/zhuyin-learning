<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>結合韻學習單產生器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print { body{background:white!important}.no-print{display:none!important}.workspace{padding:0!important;display:block!important}.paper{width:210mm!important;min-height:297mm!important;margin:0!important;box-shadow:none!important;border:0!important} }
    .paper{width:210mm;min-height:297mm}.trace{color:transparent;-webkit-text-stroke:2px #cbd5e1}.choice.active{background:#0f766e;color:white;border-color:#0f766e;box-shadow:0 3px 0 #115e59;transform:translateY(-1px)}.choice{transition:.15s ease}.choice:hover{border-color:#5eead4;background:#f0fdfa}.choice.active:hover{background:#0f766e;color:white}
  </style>
</head>
<body class="bg-slate-100 text-slate-800">
  <div class="min-h-screen flex flex-col lg:flex-row">
    <aside class="no-print lg:w-[390px] shrink-0 bg-white border-r border-slate-200 p-5 lg:p-7 overflow-y-auto">
      <div class="mb-7"><div class="inline-flex rounded-full bg-teal-50 px-3 py-1 text-sm font-bold text-teal-700 mb-3">注音教學工具</div><h1 class="text-3xl font-black tracking-tight">結合韻學習單<br><span class="text-teal-600">線上產生器</span></h1><p class="mt-3 text-sm leading-6 text-slate-500">把「聲母＋韻母＋聲調」拆開練，再組合起來讀。選好條件後即可產生一張 A4 學習單。</p></div>
      <section class="space-y-6">
        <div><div class="flex items-center justify-between mb-2"><label class="font-bold">① 選擇結合韻</label><button id="allFinals" class="text-xs text-teal-700 font-bold">全選</button></div><div id="finals" class="grid grid-cols-4 gap-2"></div></div>
        <div><div class="flex items-center justify-between mb-2"><label class="font-bold">② 選擇聲母</label><button id="allInitials" class="text-xs text-teal-700 font-bold">全選</button></div><div id="initials" class="grid grid-cols-6 gap-2"></div></div>
        <div><label class="font-bold block mb-2">③ 聲調</label><div id="tones" class="grid grid-cols-5 gap-2"></div></div>
        <div class="rounded-2xl bg-amber-50 border border-amber-200 p-4"><label class="font-bold block mb-2">④ 每張學習單題數</label><input id="count" type="range" min="3" max="9" value="6" class="w-full accent-teal-600" /><div class="flex justify-between text-xs text-slate-500"><span>3 題</span><strong id="countLabel" class="text-amber-700">6 題</strong><span>9 題</span></div></div>
        <div class="flex gap-2 pt-1"><button id="generate" class="flex-1 rounded-xl bg-teal-700 hover:bg-teal-800 text-white font-bold py-3 shadow-sm">重新產生</button><button id="print" class="rounded-xl border border-slate-300 bg-white px-4 font-bold hover:bg-slate-50">列印</button></div>
      </section>
    </aside>
    <main class="workspace flex-1 overflow-auto p-4 lg:p-10 flex justify-center"><article class="paper bg-white shadow-xl border border-slate-200 p-[13mm] relative overflow-hidden"><div class="absolute inset-[7mm] border-2 border-dashed border-teal-700/15 rounded-3xl pointer-events-none"></div><div class="relative z-10">
      <header class="flex justify-between items-start border-b-2 border-slate-800 pb-3 mb-5"><div><p class="text-sm font-bold text-teal-700 tracking-widest">注音符號練習</p><h2 class="text-3xl font-black mt-1">結合韻小達人</h2></div><div class="text-sm font-bold pt-2">姓名：<span class="inline-block w-28 border-b border-slate-600"></span></div></header>
      <div class="rounded-2xl bg-teal-50 border border-teal-100 px-5 py-3 mb-5 flex items-center justify-between"><div><p class="text-xs font-bold text-teal-700">今天練習</p><p id="summary" class="font-bold">聲母＋結合韻＋聲調</p></div><div class="text-3xl">✏️</div></div>
      <section class="mb-5"><div class="flex items-center gap-2 mb-2"><span class="rounded-full bg-amber-200 px-3 py-1 text-sm font-bold text-amber-900">一、拼一拼</span><span class="text-xs text-slate-500">先找聲母，再把韻母合起來</span></div><div id="cards" class="grid grid-cols-3 gap-3"></div></section>
      <section class="mb-5"><div class="flex items-center gap-2 mb-2"><span class="rounded-full bg-sky-200 px-3 py-1 text-sm font-bold text-sky-900">二、描一描</span><span class="text-xs text-slate-500">沿著灰色筆畫練習</span></div><div id="traceGrid" class="grid grid-cols-6 gap-2"></div></section>
      <section class="mb-5"><div class="flex items-center gap-2 mb-2"><span class="rounded-full bg-rose-200 px-3 py-1 text-sm font-bold text-rose-900">三、找一找</span><span class="text-xs text-slate-500">把今天的結合韻圈起來</span></div><div id="bubbleGrid" class="grid grid-cols-6 gap-2 border-2 border-slate-200 rounded-2xl p-3"></div></section>
      <section><div class="flex items-center gap-2 mb-2"><span class="rounded-full bg-violet-200 px-3 py-1 text-sm font-bold text-violet-900">四、讀一讀</span><span class="text-xs text-slate-500">看圖念詞語，再把結合韻圈起來</span></div><div id="words" class="grid grid-cols-3 gap-3"></div></section>
      <footer class="mt-5 pt-3 border-t border-slate-200 flex justify-between text-xs text-slate-400"><span>我會把聲母和韻母拼在一起！</span><span>完成日期：＿＿＿＿</span></footer>
    </div></article></main>
  </div>
  <script>
    const finals=[['ㄧㄚ',['家','ㄐㄧㄚ','🏠'],['牙','ㄧㄚˊ','🦷']],['ㄧㄛ',['唷','ㄧㄛ','😮']],['ㄧㄝ',['葉','ㄧㄝˋ','🍂'],['也','ㄧㄝˇ','🙂']],['ㄧㄞ',['崖','ㄧㄞˊ','⛰️']],['ㄧㄠ',['鳥','ㄋㄧㄠˇ','🐦'],['藥','ㄧㄠˋ','💊']],['ㄧㄡ',['有','ㄧㄡˇ','🙋'],['牛','ㄋㄧㄡˊ','🐮']],['ㄧㄢ',['天','ㄊㄧㄢ','☁️'],['錢','ㄑㄧㄢˊ','🪙']],['ㄧㄣ',['音','ㄧㄣ','🎵'],['心','ㄒㄧㄣ','❤️']],['ㄧㄤ',['羊','ㄧㄤˊ','🐑'],['香','ㄒㄧㄤ','🌸']],['ㄧㄥ',['星','ㄒㄧㄥ','⭐'],['冰','ㄅㄧㄥ','🧊']],['ㄨㄚ',['花','ㄏㄨㄚ','🌸'],['瓜','ㄍㄨㄚ','🍉']],['ㄨㄛ',['我','ㄨㄛˇ','🙋'],['國','ㄍㄨㄛˊ','🌏']],['ㄨㄞ',['歪','ㄨㄞ','↗️'],['怪','ㄍㄨㄞˋ','👾']],['ㄨㄟ',['威','ㄨㄟ','💪'],['回','ㄏㄨㄟˊ','🔄']],['ㄨㄢ',['彎','ㄨㄢ','〰️'],['玩','ㄨㄢˊ','🎮']],['ㄨㄣ',['文','ㄨㄣˊ','📖'],['問','ㄨㄣˋ','❓']],['ㄨㄤ',['王','ㄨㄤˊ','👑'],['網','ㄨㄤˇ','🕸️']],['ㄨㄥ',['翁','ㄨㄥ','👴'],['公','ㄍㄨㄥ','🧑']],['ㄩㄝ',['月','ㄩㄝˋ','🌙'],['學','ㄒㄩㄝˊ','📚']],['ㄩㄢ',['圓','ㄩㄢˊ','⭕'],['元','ㄩㄢˊ','🪙']],['ㄩㄣ',['雲','ㄩㄣˊ','☁️'],['群','ㄑㄩㄣˊ','👥']],['ㄩㄥ',['用','ㄩㄥˋ','✅'],['熊','ㄒㄩㄥˊ','🐻']]];
    const initials='ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ'.split('');const toneOptions=[['一聲 ˉ',''],['二聲 ˊ','ˊ'],['三聲 ˇ','ˇ'],['四聲 ˋ','ˋ'],['輕聲 ˙','˙']];let selectedFinals=new Set(['ㄧㄚ','ㄧㄝ','ㄧㄠ','ㄧㄡ','ㄨㄚ','ㄨㄛ','ㄨㄟ','ㄨㄢ','ㄩㄝ','ㄩㄢ']),selectedInitials=new Set(['ㄅ','ㄆ','ㄇ','ㄉ','ㄊ','ㄋ','ㄌ','ㄐ','ㄑ','ㄒ','ㄍ','ㄏ']),selectedTone='';let questions=[];const $=id=>document.getElementById(id);
    function choice(text,active,click){const b=document.createElement('button');b.className='choice border border-slate-200 rounded-lg py-2 text-sm font-bold bg-slate-50';b.textContent=text;if(active)b.classList.add('active');b.onclick=click;return b}
    function renderControls(){$('finals').innerHTML='';finals.forEach(f=>$('finals').append(choice(f[0],selectedFinals.has(f[0]),()=>{selectedFinals.has(f[0])?selectedFinals.delete(f[0]):selectedFinals.add(f[0]);renderControls();generate()})));$('initials').innerHTML='';initials.forEach(i=>$('initials').append(choice(i,selectedInitials.has(i),()=>{selectedInitials.has(i)?selectedInitials.delete(i):selectedInitials.add(i);renderControls();generate()})));$('tones').innerHTML='';toneOptions.forEach(t=>$('tones').append(choice(t[0],selectedTone===t[1],()=>{selectedTone=t[1];renderControls();generate()})))}
    function makeQuestions(){if(!selectedFinals.size)selectedFinals.add(finals[0][0]);if(!selectedInitials.size)selectedInitials.add(initials[0]);const fs=finals.filter(f=>selectedFinals.has(f[0])),ins=[...selectedInitials],count=Number($('count').value);questions=Array.from({length:count},(_,n)=>{const f=fs[n%fs.length],i=ins[n%ins.length],mark=selectedTone||['','ˊ','ˇ','ˋ'][n%4];return{final:f[0],initial:i,syllable:i+f[0]+mark,sample:f[1+n%(f.length-1)]||f[1]}})}
    function generate(){makeQuestions();const targets=questions.map(q=>q.final);$('summary').textContent=`練習 ${[...new Set(targets)].join('、')}　共 ${questions.length} 題`;$('cards').innerHTML=questions.map(q=>`<div class="border-2 border-slate-200 rounded-xl p-3 text-center"><div class="text-xs text-slate-500 mb-1">聲母　＋　結合韻</div><div class="text-2xl font-black"><span class="text-teal-700">${q.initial}</span> <span class="text-amber-600">＋ ${q.final}</span></div><div class="text-4xl font-black mt-2 tracking-widest">${q.syllable}</div><div class="mt-2 border-t border-dashed border-slate-300 pt-2 text-xs text-slate-500">我會拼：＿＿＿＿</div></div>`).join('');$('traceGrid').innerHTML=questions.map(q=>`<div class="h-20 border-2 border-dashed border-slate-300 rounded-xl flex items-center justify-center"><span class="trace text-4xl font-black">${q.syllable}</span></div>`).join('');const pool=[...new Set(targets)],bubbles=[...targets,...Array.from({length:Math.max(questions.length*2,8)},(_,i)=>pool[(i+3)%pool.length]||finals[i%finals.length][0])].sort(()=>Math.random()-.5);$('bubbleGrid').innerHTML=bubbles.map(x=>`<div class="h-11 rounded-full border-2 border-slate-300 flex items-center justify-center font-black text-lg">${x}</div>`).join('');$('words').innerHTML=questions.slice(0,3).map(q=>`<div class="rounded-xl bg-slate-50 border border-slate-200 p-3 flex items-center gap-3"><div class="text-3xl">${q.sample[2]}</div><div><div class="font-black text-lg">${q.sample[0]}</div><div class="text-sm text-slate-500 tracking-widest">${q.sample[1]}</div><div class="text-xs mt-1">圈出：<span class="font-bold">${q.final}</span></div></div></div>`).join('')}
    $('allFinals').onclick=()=>{selectedFinals=new Set(finals.map(f=>f[0]));renderControls();generate()};$('allInitials').onclick=()=>{selectedInitials=new Set(initials);renderControls();generate()};$('generate').onclick=generate;$('print').onclick=()=>window.print();$('count').oninput=()=>{$('countLabel').textContent=`${$('count').value} 題`;generate()};renderControls();generate();
  </script>
</body>
</html>
